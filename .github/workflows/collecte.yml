name: Collecte veille stages

on:
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collecte (BPCE, BNP, CA CIB, Welcome to the Jungle, pages carrières)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FORCE_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python collectors/run_all.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "veille-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || git commit -m "Collecte du $(date -u +%F)"
          git push
